<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Mente — un espacio para pensar, entender y seguir adelante."
    >

    <meta name="theme-color" content="#f4f6f3">

    <title>Mente</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- ENCABEZADO -->
        <header class="header">
            <a href="index.html" class="logo">MENTE</a>

            <button
                class="menu-button"
                aria-label="Abrir menú"
                type="button"
            >
                <span></span>
                <span></span>
            </button>
        </header>


        <!-- CONTENIDO PRINCIPAL -->
        <main>

            <!-- BIENVENIDA -->
            <section class="welcome">

                <p class="eyebrow">Un momento para ti</p>

                <h1>
                    Tómate un momento.
                </h1>

                <p class="welcome-text">
                    No tienes que tener todo resuelto.
                    Puedes empezar por contar lo que está pasando.
                </p>

                <button class="main-action" type="button">
                    Cuéntame qué pasa
                    <span>→</span>
                </button>

            </section>


            <!-- NECESIDADES -->
            <section class="needs">

                <div class="section-heading">
                    <p class="eyebrow">Mente puede ayudarte</p>

                    <h2>
                        ¿Qué necesitas ahora?
                    </h2>
                </div>


                <div class="needs-grid">

                    <button class="need-card" type="button">
                        <span class="need-icon">◌</span>

                        <span class="need-title">
                            Entender
                        </span>

                        <span class="need-description">
                            Quiero entender lo que me pasa.
                        </span>
                    </button>


                    <button class="need-card" type="button">
                        <span class="need-icon">◇</span>

                        <span class="need-title">
                            Decidir
                        </span>

                        <span class="need-description">
                            Tengo algo importante que decidir.
                        </span>
                    </button>


                    <button class="need-card" type="button">
                        <span class="need-icon">〰</span>

                        <span class="need-title">
                            Calmarme
                        </span>

                        <span class="need-description">
                            Necesito bajar un poco lo que siento.
                        </span>
                    </button>


                    <button class="need-card" type="button">
                        <span class="need-icon">○</span>

                        <span class="need-title">
                            Hablar
                        </span>

                        <span class="need-description">
                            Hay algo que necesito contar.
                        </span>
                    </button>

                </div>

            </section>


            <!-- MENSAJE -->
            <section class="closing-message">

                <div class="closing-line"></div>

                <p>
                    Puedes empezar por donde quieras.
                </p>

                <span>
                    MENTE
                </span>

            </section>

        </main>


        <!-- NAVEGACIÓN INFERIOR -->
        <nav class="bottom-navigation" aria-label="Navegación principal">

            <a href="index.html" class="nav-item active">
                <span class="nav-icon">⌂</span>
                <span>Inicio</span>
            </a>

            <button class="nav-item" type="button">
                <span class="nav-icon">◉</span>
                <span>Explorar</span>
            </button>

            <button class="nav-item center-action" type="button">
                <span class="chat-button">+</span>
                <span>Hablar</span>
            </button>

            <button class="nav-item" type="button">
                <span class="nav-icon">♡</span>
                <span>Mi Mente</span>
            </button>

        </nav>

    </div>


    <script src="script.js"></script>

</body>
</html>
