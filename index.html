<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MENTE | Bienestar mental</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f6;
            color: #24332f;
        }

        button,
        textarea {
            font-family: inherit;
        }

        .contenedor {
            max-width: 950px;
            margin: auto;
            padding: 30px 20px 50px;
        }

        /* LOGO */

        .logo {
            font-size: 44px;
            font-weight: bold;
            text-align: center;
            margin-top: 25px;
            letter-spacing: 2px;
        }

        .subtitulo {
            text-align: center;
            font-size: 18px;
            color: #64736e;
            margin: 8px auto 45px;
            max-width: 600px;
            line-height: 1.5;
        }

        /* INICIO */

        .saludo {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .pregunta {
            text-align: center;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .emociones {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .emocion {
            border: none;
            background: white;
            border-radius: 18px;
            padding: 17px 20px;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: 0.2s;
        }

        .emocion:hover {
            transform: translateY(-3px);
        }

        .emocion.seleccionada {
            transform: translateY(-3px);
            box-shadow: 0 7px 22px rgba(0,0,0,0.14);
        }

        /* RESPUESTA */

        .respuesta {
            display: none;
            background: white;
            margin: 30px auto;
            padding: 30px;
            max-width: 700px;
            border-radius: 24px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
            text-align: center;
            animation: aparecer 0.3s ease;
        }

        .respuesta.visible {
            display: block;
        }

        .respuesta h2 {
            margin-top: 0;
            font-size: 25px;
        }

        .respuesta p {
            font-size: 17px;
            line-height: 1.65;
            color: #5d6b67;
        }

        .opciones-respuesta {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .opcion-respuesta {
            border: none;
            background: #eef2f0;
            padding: 13px 17px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .opcion-respuesta:hover {
            transform: translateY(-2px);
        }

        /* TARJETAS */

        .seccion {
            margin-top: 50px;
        }

        .seccion h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .opciones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .opcion {
            background: white;
            padding: 25px 18px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: 0.2s;
        }

        .opcion:hover {
            transform: translateY(-4px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.10);
        }

        .icono {
            font-size: 35px;
            display: block;
            margin-bottom: 10px;
        }

        /* HERRAMIENTAS */

        .herramienta {
            display: none;
            background: white;
            margin: 35px auto;
            padding: 35px 25px;
            max-width: 700px;
            border-radius: 25px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            text-align: center;
            animation: aparecer 0.4s ease;
        }

        .herramienta.visible {
            display: block;
        }

        .herramienta h2 {
            margin-top: 0;
            font-size: 27px;
        }

        .herramienta p {
            color: #63706c;
            line-height: 1.65;
        }

        /* RESPIRACIÓN */

        .respiracion {
            margin: 35px auto;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: #dfeee9;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 1s ease;
        }

        .respiracion.inhalar {
            transform: scale(1.35);
        }

        .respiracion.mantener {
            transform: scale(1.35);
        }

        .respiracion.exhalar {
            transform: scale(1);
        }

        .respiracion-contenido {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #fase {
            font-size: 21px;
            font-weight: bold;
        }

        #contador {
            font-size: 40px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* BOTONES */

        .boton-principal {
            border: none;
            background: #24332f;
            color: white;
            padding: 14px 23px;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        .boton-secundario {
            border: none;
            background: #edf1ef;
            color: #24332f;
            padding: 13px 21px;
            border-radius: 15px;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
        }

        /* DIARIO */

        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            border: 1px solid #dfe5e2;
            border-radius: 18px;
            padding: 18px;
            font-size: 16px;
            outline: none;
            background: #fafcfa;
        }

        textarea:focus {
            border-color: #9caaa5;
        }

        .mensaje-guardado {
            color: #65736e;
            font-size: 14px;
            min-height: 20px;
        }

        /* TEMPORIZADOR */

        .temporizador {
            font-size: 58px;
            font-weight: bold;
            margin: 25px 0;
        }

        .temporizador-descripcion {
            font-size: 18px;
            color: #63706c;
        }

        /* CRISIS */

        .seguridad {
            margin-top: 50px;
            padding: 22px;
            background: #fff;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #e5e8e6;
        }

        .seguridad p {
            color: #63706c;
            line-height: 1.6;
            font-size: 14px;
        }

        /* FOOTER */

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 25px;
            color: #7a8783;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ANIMACIÓN */

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* CELULAR */

        @media (max-width: 600px) {

            .contenedor {
                padding: 25px 15px 40px;
            }

            .logo {
                font-size: 38px;
            }

            .subtitulo {
                font-size: 16px;
            }

            .saludo {
                font-size: 26px;
            }

            .pregunta {
                font-size: 18px;
            }

            .emocion {
                width: 100%;
                max-width: 280px;
            }

            .respuesta,
            .herramienta {
                padding: 25px 18px;
            }

            .respiracion {
                width: 165px;
                height: 165px;
            }

            .temporizador {
                font-size: 48px;
            }

        }

    </style>

</head>
