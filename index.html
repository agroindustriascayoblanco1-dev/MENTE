<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIND</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome">

        <div class="brand">

            <img 
                src="conocimiento.png" 
                alt="Logo de MIND" 
                class="logo"
            >

            <h1>MIND</h1>

            <p>Un espacio para ti.</p>

        </div>


        <section class="feeling-section">

            <h2>¿Cómo te sientes hoy?</h2>

            <p class="subtitle">
                Tómate un momento para reconocer cómo estás.
            </p>


            <div class="feelings">

                <button class="feeling" data-feeling="Ansioso">
                    <span class="emoji">😰</span>
                    <span>Ansioso</span>
                </button>

                <button class="feeling" data-feeling="Triste">
                    <span class="emoji">😔</span>
                    <span>Triste</span>
                </button>

                <button class="feeling" data-feeling="Abrumado">
                    <span class="emoji">😵</span>
                    <span>Abrumado</span>
                </button>

                <button class="feeling" data-feeling="Normal">
                    <span class="emoji">😐</span>
                    <span>Normal</span>
                </button>

                <button class="feeling" data-feeling="Bien">
                    <span class="emoji">😊</span>
                    <span>Bien</span>
                </button>

            </div>


            <button class="continue-button" id="continueButton">
                Continuar
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
